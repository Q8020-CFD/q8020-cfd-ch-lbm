# =====================================================================
# SHOCK fill-ins : CH "A-GAME" q7/q8 + QLBM q8, same shock point
# ---------------------------------------------------------------------
# Fills the gaps in the shock-movie sequence (bakeoff_shock_qubit_dialup):
#   * CH q7, q8 with the "A-game" knobs (where baseline CH went marginal
#     / detonated).
#   * QLBM q8 with per-frame snapshots (the existing q8 QLBM was
#     final-only, so it could not go in the movie).
# The baseline CH q6 and the QALB/reference runs are reused as-is.
#
# Operating point matches burgers_ab_shock_q{7,8}: A=0.4, nu=0.03,
# cfl=0.1, periodic sine, measure_reprepare.  n-steps SCALES with the
# grid (460 / 920 for q7/8) so they reach the SAME physical time as the
# kept q6 run, ~90% t_shock (t_end = 0.3594, t_shock = 1/(A*2*pi) =
# 0.3979).  save-every = 10 throughout, so snapshot times nest (q6 frame
# k <-> q7 2k <-> q8 4k) and everything overlays on q6's timeline.
# segment-size = 5 matches the q4/q6 CH runs already in the movie, so
# phi-modes is the ONLY varying CH knob across the ladder (clean control).
# Teasing out segment-size as a lever is a SEPARATE study
# (burgers_ch_segsize_shock_q7.toml).
#
# A-game knobs: bond-dim is held at the BASELINE 8 -- the bd sweep
# (bd 1/2/4/8) shows CH error saturates by bd=4, and the bd=16 nu050 q8
# run still detonated, so raising bd is a confirmed no-op.  The lever
# under test is phi-modes (the Fourier low-pass kept before the inverse
# Cole-Hopf), scaled with the grid:
#       q7 (N=128) : phi-modes 16   (baseline was 8)
#       q8 (N=256) : phi-modes 32   (baseline was 8)
# =====================================================================

[global]
_output_dir = "~/q8020"
_inject_outdir = "--outdir"
_env = "./.venv"
_script = "python ./q8020-mps-burgers/src/burgers_solver.py"
"--noshow" = true
"--no-classical-reference" = true
"--no-analytic-reference" = true

# shock operating point — identical to the baseline shock runs
"--cfl" = 0.1
"--evolution-mode" = "measure_reprepare"
"--segment-size" = 5                   # matches the q4/q6 CH runs in the movie
"--save-every" = 10
"--bc" = "periodic"
"--ic" = "sine"
"--source" = "none"
"--ic-amplitude" = 0.4
"--nu" = 0.03

"--seed" = 1234
"--shots" = 150000
"--metric-transpile-timeout" = 0

# ---------------------------------------------------------------------
# n-steps scales with N so every group reaches the same ~90% t_shock
# point as the kept baseline q6 run.  --method is per-group.
[ch_q7]
"--method" = "cole_hopf_circuit"
"--propagator" = "qft-diagonal"
"--q" = 7
"--n-steps" = 460                     # ~90% t_shock at q7 (N=128)
"--bond-dim" = 8                      # baseline (bd saturated; bumping is a no-op)
"--phi-modes" = 16                    # A-game lever (baseline was 8)

[ch_q8]
"--method" = "cole_hopf_circuit"
"--propagator" = "qft-diagonal"
"--q" = 8
"--n-steps" = 920                     # ~90% t_shock at q8 (N=256)
"--bond-dim" = 8                      # baseline (bd saturated; bumping is a no-op)
"--phi-modes" = 32                    # A-game lever (baseline was 8)

[qlbm_q8]
"--method" = "qlbm_circuit"
"--q" = 8
"--n-steps" = 920                     # same shock point; per-frame snapshots
"--fock-qubits" = 3                   # qc=3 convergent (matches baseline QLBM)
"--qalb-collision-trotter-reps" = 0   # dense exact collision = best L2
