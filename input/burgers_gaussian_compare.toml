# Gaussian-IC method-comparison sweep
#
# Run:  q8020-sweep q8020-mps-burgers/input/burgers_gaussian_compare.toml
#
# Compares the QLBM circuit (Option A, hybrid by construction) against
# the only pure-quantum pathway (cole_hopf_circuit, LCU propagator), with
# classical references (shift FTCS, classical D1Q3 LBM) overlaid for
# context.  The postproc step (plot_method_compare.py) recomputes a
# Godunov reference on the fly and produces a 2-panel animated GIF:
#   top    — u(x, t) for all methods + Godunov reference
#   bottom — relative L2 error vs Godunov for each method, log scale
#
# Why this case:
#   - Gaussian IC: localized smooth pulse, no analytic CH closed-form
#     (the ∫u is an erf), so the comparison is anchored to Godunov,
#     not the cole_hopf_exact analytic family.
#   - Periodic BC: gaussian sits in the middle, exp(-25) ≈ 0 at the
#     boundary, so wrap-around is benign for all four methods.
#   - --ic-amplitude 0.4: keeps |u| within the LBM D1Q3 stability
#     window; high enough to develop a visible nonlinear steepening.
#   - q=5 (N=32): modest size — Gaussian peak spans ~6 cells at
#     sigma=0.1, enough for a recognisable visual.  Statevector mode
#     keeps QLBM+CH circuits cheap.
#   - nu=1e-2: well-behaved viscosity, well inside the regime where
#     cole_hopf_circuit shots+post-selection is healthy (the peaked-φ
#     pathology lives at nu < 1e-3, FUTURE-WORK #10).
#   - shock_pct=100: standard one-shock-time horizon.
#   - save-every=1: every step → smooth animation (~32 frames).

[global]
_output_dir = "~/q8020"
_inject_outdir = "--outdir"
_env = "./.venv"
_script = "python ./q8020-mps-burgers/src/burgers_solver.py"
"--noshow" = true
"--q" = 5
"--nu" = 1e-2
"--cfl" = 0.1
"--shock-pct" = 100.0
# Dirichlet for ALL methods.  cole_hopf needs it (the phi-equation is
# Neumann-on-phi, the dual of u-Dirichlet; periodic phi is wrong since
# the gaussian has nonzero mean so phi=exp(-int u/2nu) is not periodic).
# The gaussian decays to ~0 at the walls, so shift/lbm/qlbm are
# unaffected and all methods share one grid/timeline (n_steps=98).
"--bc" = "dirichlet"
"--ic" = "gaussian"
"--ic-amplitude" = 0.4
"--ic-center" = 0.5
"--ic-sigma" = 0.1
"--source" = "none"
# 150k shots: the gaussian-derived Cole-Hopf phi has ~35x dynamic range,
# so at 10k shots ~5 of 32 bins drew zero counts -> phi=0 -> the
# log-derivative phi->u blew up to |u|~22.  At >=1e5 shots the tail is
# resolved and |u| recovers to ~1.1.  See FUTURE-WORK #10.
"--shots" = 150000
# save-every is global so every method snapshots on the SAME steps
# (0, 7, ..., 98).  plot_method_compare intersects step keys across
# methods, so a uniform cadence keeps the full ~15-frame animation
# instead of collapsing to the coarsest method's grid.  It must equal
# (or be a multiple of) the cole_hopf_circuit chunk_size (7) below,
# since chunked mode can only snapshot on chunk boundaries.  n_steps=98
# under Dirichlet, and 7 divides 98 (14 chunks).
"--save-every" = 7

# ── Classical references ─────────────────────────────────────────────
# Both run with the same globals; results overlay onto the animation
# alongside the Godunov reference that the postproc recomputes.

[gauss_shift_q5]
"--method" = "shift"

[gauss_lbm_q5]
"--method" = "lbm"

# ── Quantum-circuit methods (the headline comparison) ────────────────
# qlbm_circuit:   Option A, hybrid (classical f_post shadow → Householder
#                 dilation → unitary playback).  Statevector mode here;
#                 swap --shots > 0 to exercise the new shots path.
# cole_hopf_circuit (dense-block): pure-quantum Pathway 2 in shots mode.
#                 phi >= 0 by construction, so direct readout already has
#                 correct signs -- no sign recovery needed (cf. qlbm).

[gauss_qlbm_circuit_q5]
"--method" = "qlbm_circuit"
# Stand-alone interferometric sign recovery (per-bin Hadamard test).
# Needed because the LBM distributions f can go negative once the pulse
# steepens, and direct sqrt(counts) readout only recovers |f|.
"--sign-recovery" = "hadamard_test"

[gauss_cole_hopf_circuit_q5]
"--method" = "cole_hopf_circuit"
# dense-block (exact eigendecomposition, valid q<=5) is the shots
# propagator used by the paper-scale 150k runs.  LCU is NOT used for
# shots here: its per-step ancilla resets defeat Aer's shot-sampling
# optimisation (~27 ms/shot -> ~19 h at 150k), whereas dense-block
# transpiles to basis gates (~2 ms/shot, ~5 min/chunk at 150k).
"--propagator" = "dense-block"
# No --phi-modes: low-passing the SHARP gaussian phi rings (Gibbs) and
# can drive phi < 0 -> log-derivative blow-up.  The phi-tail is instead
# resolved by the global 150k shots (validated non-divergent; at 50k it
# blows up to |u|~22).  See FUTURE-WORK #10.
#
# Chunked evolution bounds per-circuit depth.  n_steps=98 under the
# global Dirichlet BC (98 = 2*7*7), so chunk_size must divide 98;
# chunk_size=7 with the global save-every=7 -> 14 chunks, 15 shared
# snapshots (steps 0,7,...,98), keeping the full ~15-frame animation.
"--evolution-mode" = "chunked"
"--chunk-size" = 7

# ── Postproc ─────────────────────────────────────────────────────────
# plot_method_compare.py harvests all four cases above plus computes a
# Godunov reference from the IC at runtime.  Output: method_compare.gif
# in the sweep run dir.

_group_postproc = ["./.venv/bin/python ./q8020-mps-burgers/postproc/plot_method_compare.py"]
