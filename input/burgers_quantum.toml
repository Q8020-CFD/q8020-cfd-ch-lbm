# Burgers 1D Quantum Solver Sweep
# Run: q8020-sweep qcfd-mps-burgers/input/burgers_quantum.toml
#
# shock_pct=63.0 → T_end ≈ 0.1006 (63% of t_shock = 1/2π ≈ 0.1592)
# n_steps = T_end / (CFL * dx) = T_end * N / CFL   (CFL = Courant-Friedrichs-Lewy number)
#
# NOTE: periodic BC uses endpoint=False → dx=1/N; Dirichlet uses
# endpoint=True → dx=1/(N-1).  At the same q, dt=cfl*dx differs slightly
# between the two, so cross-BC comparisons are at different physical times.
#   q=3 N=8:   n_steps ≈ 8
#   q=4 N=16:  n_steps ≈ 16
#   q=5 N=32:  n_steps ≈ 32
#   q=6 N=64:  n_steps ≈ 64
#   q=7 N=128: n_steps ≈ 128
#   q=8 N=256: n_steps ≈ 256

[global]
_output_dir = "~/q8020"
_inject_outdir = "--outdir"
_env = "./qcfd-mps-burgers/.venv"
_script = "python ./qcfd-mps-burgers/src/burgers_solver.py"
"--noshow" = true
"--nu" = 1e-4
"--cfl" = 0.1
"--ic" = "sine"
"--source" = "sine"

# ── Paper-aligned runs (Meena et al. AIAA 2026) ───────
# Matches the paper exactly: Dirichlet BCs, sine IC,
# time-varying source, nu=1e-4, CFL=0.1, 100% shock time.
# These are the "gold standard" runs for q=3..6.

[paper_classical_q3]
"--q" = 3
"--shock-pct" = 100.0
"--method" = "shift"
"--bc" = "dirichlet"
"--save-every" = 2

[paper_classical_q4]
"--q" = 4
"--shock-pct" = 100.0
"--method" = "shift"
"--bc" = "dirichlet"
"--save-every" = 4

[paper_classical_q5]
"--q" = 5
"--shock-pct" = 100.0
"--method" = "shift"
"--bc" = "dirichlet"
"--save-every" = 8

[paper_qexact_q3]
"--q" = 3
"--shock-pct" = 100.0
"--method" = "quantum_exact"
"--bc" = "dirichlet"
"--save-every" = 2

[paper_qexact_q4]
"--q" = 4
"--shock-pct" = 100.0
"--method" = "quantum_exact"
"--bc" = "dirichlet"
"--save-every" = 4

[paper_qexact_q5]
"--q" = 5
"--shock-pct" = 100.0
"--method" = "quantum_exact"
"--bc" = "dirichlet"
"--save-every" = 8

[paper_qcircuit_q3]
"--q" = 3
"--shock-pct" = 100.0
"--method" = "quantum_circuit"
"--trotter-order" = 1
"--trotter-reps" = 5
"--bc" = "dirichlet"
"--save-every" = 2

[paper_qcircuit_q4]
"--q" = 4
"--shock-pct" = 100.0
"--method" = "quantum_circuit"
"--trotter-order" = 1
"--trotter-reps" = 5
"--bc" = "dirichlet"
"--save-every" = 4

[paper_qcircuit_q5]
"--q" = 5
"--shock-pct" = 100.0
"--method" = "quantum_circuit"
"--trotter-order" = 1
"--trotter-reps" = 5
"--bc" = "dirichlet"
"--save-every" = 8

# ── Paper-aligned with shots (production runs) ────────
# q=5,6 with 150k shots, 100% shock — the main experimental runs.
# _group_postproc generates the comparison plot automatically.

[paper_qcircuit_q5_shots150k]
"--q" = 5
"--shock-pct" = 100.0
"--method" = "quantum_circuit"
"--trotter-order" = 1
"--trotter-reps" = 5
"--bc" = "dirichlet"
"--shots" = 150000
"--save-every" = 8

# ── Paper-aligned MPS runs (production) ───────────────
# Full pipeline: MPS state-prep + Pauli Hamiltonian evolution.
# Dirichlet BCs, 100% shock, 150k shots, bond_dim sweep.

[paper_mps_q5_shots150k]
"--q" = 5
"--shock-pct" = 100.0
"--method" = "mps"
"--bc" = "dirichlet"
"--bond-dim" = [1, 2, 4]
"--shots" = 150000
"--save-every" = 8
_group_postproc = ["python ./qcfd-mps-burgers/docs/plot_paper_aligned.py"]

# ── Hadamard-test time evolution sweep ────────────────────────────────────
# Sweeps shock_pct from early-time through shock formation and into the
# dissipative regime.  The animation picks the longest run (200%) and
# shows the full pre→through→post shock evolution.

[hadamard_sine_sweep_q5]
"--q" = 5
"--shock-pct" = [10.0, 25.0, 50.0, 75.0, 100.0, 125.0, 150.0, 200.0]
"--method" = "quantum_circuit"
"--bc" = "dirichlet"
"--shots" = 150000
"--sign-recovery" = "hadamard_test"
"--save-every" = 1
_group_postproc = ["python ./qcfd-mps-burgers/docs/plot_hadamard_time_evolution.py"]

# ── Multi-mode Fourier IC (NOT Burgers turbulence) ────────────────────────
# Four-mode random-phase IC (A_k ~ 1/k, fixed seed) produces multiple
# shocks which form, interact, and merge.  This is a single deterministic
# field, not a statistical ensemble, so it is NOT Burgulence -- just a
# complex IC that exercises multi-shock dynamics.  See F11 in the
# implementation plan for a genuine Burgulence study.  Uses q=5 (N=32)
# for reasonable runtime.  No source term -- decaying.
# Single shock_pct since the animation only uses the longest case anyway.

# ── F2 TEBD (classical MPS/MPO evolution) ────────────────────────────────
# Dense-H -> MPO -> MPS path (Phase A).  Mirrors paper_qexact_q* params for
# fairness of comparison, but switches to periodic BC since the TEBD MPO
# is constructed from periodic shift operators.  Statevector (no shots).

[tebd_q3]
"--q" = 3
"--shock-pct" = 100.0
"--method" = "tebd"
"--bc" = "periodic"
"--save-every" = 2

[tebd_q4]
"--q" = 4
"--shock-pct" = 100.0
"--method" = "tebd"
"--bc" = "periodic"
"--save-every" = 4

[tebd_q5]
"--q" = 5
"--shock-pct" = 100.0
"--method" = "tebd"
"--bc" = "periodic"
"--save-every" = 8

[tebd_q6]
"--q" = 6
"--shock-pct" = 100.0
"--method" = "tebd"
"--bc" = "periodic"
"--save-every" = 16

# ── F10 Cole-Hopf + TEBD (heat-equation transformed) ─────────────────────
# Fixed propagator MPO, phi > 0 everywhere (no sign recovery needed).
# nu=1e-2 is required: the default global nu=1e-4 overflows float64 in the
# Cole-Hopf forward transform (phi = exp(-integral/(2 nu))).  See F10 spec.

[cole_hopf_q3]
"--q" = 3
"--nu" = 1e-2
"--shock-pct" = 100.0
"--method" = "cole_hopf"
"--bc" = "periodic"
"--source" = "none"
"--save-every" = 2

[cole_hopf_q4]
"--q" = 4
"--nu" = 1e-2
"--shock-pct" = 100.0
"--method" = "cole_hopf"
"--bc" = "periodic"
"--source" = "none"
"--save-every" = 4

[cole_hopf_q5]
"--q" = 5
"--nu" = 1e-2
"--shock-pct" = 100.0
"--method" = "cole_hopf"
"--bc" = "periodic"
"--source" = "none"
"--save-every" = 8

[cole_hopf_q6]
"--q" = 6
"--nu" = 1e-2
"--shock-pct" = 100.0
"--method" = "cole_hopf"
"--bc" = "periodic"
"--source" = "none"
"--save-every" = 16

