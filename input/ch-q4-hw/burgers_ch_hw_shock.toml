# =====================================================================
# CH HARDWARE RUNNER : shock case (F12)
# ---------------------------------------------------------------------
# Drives burgers_ch_hw_runner.py — the Cole-Hopf measure-reprepare
# segment loop on a simulator / local SamplerV2 proxy / real IBM
# hardware.  Physics mirrors q8020_burgers_ab_shock_q4.toml (q=4,
# nu=0.03, A=0.4, n_steps=60, segment_size=5 -> 12 serial QPU
# invocations — the longer chain; run smooth first).
# See docs/archive/F12-HARDWARE-RUNNER-SPEC.md.
#
# Run order (credential-free first):
#   1. --target sim   --dry-run        : free transpile, ideal basis
#   2. --target local                  : SamplerV2 + Session + noisy
#                                         FakeBackend proxy, no creds
#   3. --target hardware --backend-name ibm_boston --dry-run
#                                       : true heavy-hex CX/depth
#   4. --target hardware --backend-name ibm_boston
#                                       : the real 12-segment run
# =====================================================================

[global]
_output_dir = "~/q8020"
_inject_outdir = "--outdir"
_env = "./.venv"
_script = "python ./q8020-mps-burgers/src/burgers_ch_hw_runner.py"

"--case" = "shock"
"--target" = "sim"
"--shots" = 150000
"--seed" = 1234

# Render the evolution movie after the run.  The runner writes the quantum
# (cole_hopf_circuit) and ftcs_reference series as two case dirs under
# <case_dir>/method_compare; the postproc JSON carries case_dir, so we read
# it and point plot_method_compare.py there via --sweep-dir.
_case_postproc = [
  "./.venv/bin/python -c \"import json,sys,subprocess; d=json.load(open(sys.argv[1])); cd=d['case_dir']; subprocess.run(['./.venv/bin/python','./q8020-mps-burgers/postproc/plot_method_compare.py','--sweep-dir',cd+'/method_compare','--reference','ftcs_reference','--outfile',cd+'/method_compare.gif'],check=True)\""
]

[run]
# Single case group; the sweeper injects --outdir and runs the script.
