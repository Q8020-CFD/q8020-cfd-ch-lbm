# Gaussian-IC method-comparison sweep
#
# Run:  q8020-sweep q8020-mps-burgers/input/burgers_gaussian_compare.toml
#
# Compares the QLBM circuit (Option A, hybrid by construction) against
# the pure-quantum cole_hopf_circuit pathway (dense-block propagator),
# run in two evolution modes (measure_reprepare vs single).  Classical
# shift FTCS and D1Q3 LBM also run for the record but are hidden from the
# plot (see postproc flags below).  The postproc step
# (plot_method_compare.py) recomputes a Godunov reference on the fly and
# produces a 2-panel animated GIF:
#   top    — u(x, t) for the plotted methods + Godunov reference
#   bottom — relative L2 error vs Godunov, log scale
#
# Why this case:
#   - Gaussian IC: localized smooth pulse, no analytic CH closed-form
#     (the ∫u is an erf), so the comparison is anchored to Godunov,
#     not the cole_hopf_exact analytic family.
#   - Dirichlet BC: cole_hopf needs it (Neumann-on-phi); the gaussian
#     decays to ~0 at the walls so all methods share one grid/timeline
#     (full rationale at the --bc line below).
#   - --ic-amplitude 0.4: keeps |u| within the LBM D1Q3 stability
#     window; high enough to develop a visible nonlinear steepening.
#   - q=5 (N=32): modest size — Gaussian peak spans ~6 cells at
#     sigma=0.1, enough for a recognisable visual and keeps the
#     150k-shot QLBM+CH circuits tractable.
#   - nu=1e-2: well-behaved viscosity, well inside the regime where
#     cole_hopf_circuit shots+post-selection is healthy (the peaked-φ
#     pathology lives at nu < 1e-3, FUTURE-WORK #10).
#   - shock_pct=100: standard one-shock-time horizon.
#   - save-every=7: snapshot cadence (n_steps=98 -> 15 raw snapshots);
#     the plot anchors these onto qlbm's ~11 genuine lattice steps.

[global]
_output_dir = "~/q8020"
_inject_outdir = "--outdir"
_env = "./.venv"
_script = "python ./q8020-mps-burgers/src/burgers_solver.py"
"--noshow" = true
"--q" = 5
"--nu" = 1e-2
"--cfl" = 0.1
"--shock-pct" = 100.0
# Dirichlet for ALL methods.  cole_hopf needs it (the phi-equation is
# Neumann-on-phi, the dual of u-Dirichlet; periodic phi is wrong since
# the gaussian has nonzero mean so phi=exp(-int u/2nu) is not periodic).
# The gaussian decays to ~0 at the walls, so shift/lbm/qlbm are
# unaffected and all methods share one grid/timeline (n_steps=98).
"--bc" = "dirichlet"
"--ic" = "gaussian"
"--ic-amplitude" = 0.4
"--ic-center" = 0.5
"--ic-sigma" = 0.1
"--source" = "none"
# 150k shots: the gaussian-derived Cole-Hopf phi has ~35x dynamic range,
# so at 10k shots ~5 of 32 bins drew zero counts -> phi=0 -> the
# log-derivative phi->u blew up to |u|~22.  At >=1e5 shots the tail is
# resolved and |u| recovers to ~1.1.  See FUTURE-WORK #10.
"--shots" = 150000
# save-every is global so every method snapshots on the same caller
# steps (0, 7, ..., 98).  plot_method_compare resamples each method onto
# a common timeline (here anchored to qlbm's genuine lattice steps), so
# the cadence no longer has to be intersected across methods.  It must
# still be a multiple of the cole_hopf_circuit segment_size (7) below,
# since measure_reprepare mode can only snapshot on segment boundaries.
# n_steps=98 under Dirichlet, and 7 divides 98 (14 segments).
"--save-every" = 7

# ── Classical references ─────────────────────────────────────────────
# Both run with the same globals; results overlay onto the animation
# alongside the Godunov reference that the postproc recomputes.

[gauss_shift_q5]
"--method" = "shift"

[gauss_lbm_q5]
"--method" = "lbm"

# ── Quantum-circuit methods (the headline comparison) ────────────────
# qlbm_circuit:   Option A, hybrid (classical f_post shadow → Householder
#                 dilation → unitary playback).  Statevector mode here;
#                 swap --shots > 0 to exercise the new shots path.
# cole_hopf_circuit (dense-block): pure-quantum Pathway 2 in shots mode.
#                 phi >= 0 by construction, so direct readout already has
#                 correct signs -- no sign recovery needed (cf. qlbm).

[gauss_qlbm_circuit_q5]
"--method" = "qlbm_circuit"
# Stand-alone interferometric sign recovery (per-bin Hadamard test).
# Needed because the LBM distributions f can go negative once the pulse
# steepens, and direct sqrt(counts) readout only recovers |f|.
"--sign-recovery" = "hadamard_test"

[gauss_cole_hopf_circuit_q5]
"--method" = "cole_hopf_circuit"
# dense-block (exact eigendecomposition, valid q<=5) is the shots
# propagator used by the paper-scale 150k runs.  LCU is NOT used for
# shots here: its per-step ancilla resets defeat Aer's shot-sampling
# optimisation (~27 ms/shot -> ~19 h at 150k), whereas dense-block
# transpiles to basis gates (~2 ms/shot, ~5 min/segment at 150k).
"--propagator" = "dense-block"
# No --phi-modes: low-passing the SHARP gaussian phi rings (Gibbs) and
# can drive phi < 0 -> log-derivative blow-up.  The phi-tail is instead
# resolved by the global 150k shots (validated non-divergent; at 50k it
# blows up to |u|~22).  See FUTURE-WORK #10.
#
# Measure-and-reprepare (segmented) evolution bounds per-circuit depth.
# n_steps=98 under the global Dirichlet BC (98 = 2*7*7), so segment_size
# must divide 98; segment_size=7 with the global save-every=7 -> 14
# segments, snapshots on steps 0,7,...,98.
"--evolution-mode" = "measure_reprepare"
"--segment-size" = 7

[gauss_cole_hopf_circuit_unchunked_q5]
"--method" = "cole_hopf_circuit"
"--propagator" = "dense-block"
# Single: each saved step is one direct psi0 -> psi(t) evolution
# circuit (_run_shots_batch), no inter-segment ancilla resets or
# post-selection chaining.  Snapshots land on the global save-every grid
# (0,7,...,98); single mode does NOT require n_steps % segment_size == 0,
# so there is no segment-alignment constraint here.  Compared against the
# segmented case above this isolates how much the segmented post-selection
# chaining costs in accuracy vs the single-shot-window baseline.
"--evolution-mode" = "single"

# ── Postproc ─────────────────────────────────────────────────────────
# plot_method_compare.py harvests all five cases above plus computes a
# Godunov reference from the IC at runtime.  Output: method_compare.gif
# in the sweep run dir.
#
# Flags (apples-to-apples MPS vs qLBM):
#   --anchor qlbm_circuit : timeline = qlbm's GENUINE native lattice steps
#       (LBM is locked to dt_lbm=dx, so it has only T_end/dx ~ 11 real
#       states at q=5).  Every other method is sampled onto exactly those
#       steps -- qlbm is never nearest-neighbor padded and the MPS
#       (cole_hopf_circuit) solve is never coarsened, only its output is
#       subsampled to the shared times.  The solver now persists only the
#       genuine LBM-family steps, so the stored series matches the plot.
#   --hide lbm,shift : drop the classical D1Q3 LBM and FTCS method lines;
#       FTCS is redundant once Godunov is the single reference.
#   --ref godunov : single reference (entropy-satisfying upwind flux +
#       viscous diffusion), more faithful than FTCS as the pulse steepens.
#   --no-ic : drop the initial-condition line.

_group_postproc = ["./.venv/bin/python ./q8020-mps-burgers/postproc/plot_method_compare.py --anchor qlbm_circuit --hide lbm,shift --ref godunov --no-ic"]
